<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0B132B" />
      <stop offset="50%" stopColor="#1C2541" />
      <stop offset="100%" stopColor="#0B132B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFE066" />
      <stop offset="45%" stopColor="#F5B800" />
      <stop offset="100%" stopColor="#C97F00" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#34D399" />
      <stop offset="100%" stopColor="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Rounded Squircle Background -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.7" />

  <!-- Inner Soft Radial Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#emeraldGrad)" opacity="0.15" filter="url(#glow)" />

  <!-- Chat Bubble Shape -->
  <path
    d="M 120 220 C 120 150 180 110 256 110 C 332 110 392 150 392 220 C 392 285 338 325 268 328 L 220 376 C 210 386 195 380 196 366 L 200 326 C 150 315 120 275 120 220 Z"
    fill="url(#emeraldGrad)"
    opacity="0.9"
  />

  <!-- Royal Crown on top -->
  <g transform="translate(196, 140)">
    <path
      d="M 10 70 L 25 25 L 60 50 L 95 25 L 110 70 Z"
      fill="url(#goldGrad)"
      filter="url(#glow)"
    />
    <circle cx="25" cy="22" r="6" fill="#FFF" />
    <circle cx="60" cy="46" r="6" fill="#FFF" />
    <circle cx="95" cy="22" r="6" fill="#FFF" />
    <rect x="10" y="70" width="100" height="12" rx="4" fill="url(#goldGrad)" />
  </g>

  <!-- Microphone / Audio Sound Wave inside -->
  <g transform="translate(232, 220)" fill="#FFFFFF">
    <rect x="18" y="5" width="12" height="30" rx="6" />
    <path d="M 8 20 A 16 16 0 0 0 40 20" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <line x1="24" y1="36" x2="24" y2="48" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <line x1="12" y1="48" x2="36" y2="48" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Typography: TOTI CHAT -->
  <text
    x="256"
    y="445"
    text-anchor="middle"
    font-family="'Cairo', sans-serif"
    font-weight="900"
    font-size="44"
    fill="url(#goldGrad)"
    letter-spacing="2"
  >
    توتي شات
  </text>
</svg>

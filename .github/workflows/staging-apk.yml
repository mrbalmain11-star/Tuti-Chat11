name: Build TotiChat Staging APK V011
on:
  workflow_dispatch: {}
  push:
    branches:
      - integration/legacy-backend-staging
    paths:
      - 'build-requests/staging-apk-*.txt'
permissions:
  contents: write
jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Assert Java 21 toolchain
        run: |
          java -version
          javac -version
          test "$(javac -version 2>&1 | awk '{print $2}' | cut -d. -f1)" = "21"
      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          test -d "${ANDROID_HOME}/platform-tools"
          test -d "${ANDROID_HOME}/cmdline-tools"
          java -version
      - name: Install web and Capacitor dependencies
        run: npm install --no-audit --no-fund
      - name: Validate TypeScript
        run: npm run lint
      - name: Require staging publishable key
        env:
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Configure STAGING_SUPABASE_PUBLISHABLE_KEY before building a functional APK"
            exit 1
          fi
      - name: Verify staging API key before packaging
        env:
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output /tmp/auth-health.json --write-out '%{http_code}' --header "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" "https://rziaedugbdwefbefcxjt.supabase.co/auth/v1/health")
          if [ "$status" != "200" ]; then
            echo "::error::Staging Supabase API key was rejected by Auth (HTTP $status)"
            exit 1
          fi
          echo "Staging Auth API key check passed"
      - name: Build staging web bundle
        env:
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - name: Generate complete Android project in CI
        run: |
          # Existing checked-in Android folder is incomplete (Gradle wrapper missing).
          # Regenerate it only inside the disposable CI runner; repository stays unchanged.
          rm -rf android
          npx cap add android
      - name: Restore matching Firebase staging configuration
        run: |
          # Android is regenerated by CI; preserve its package-specific Firebase
          # client configuration without altering the established APK packaging.
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = Path("staging/firebase/google-services.json")
          data = json.loads(source.read_text())
          assert data["project_info"]["project_id"] == "totichatpro"
          assert any(
              c["client_info"]["android_client_info"]["package_name"] == "com.numyar.totichat.staging"
              for c in data["client"]
          ), "Firebase staging Android client missing"
          target = Path("android/app/google-services.json")
          target.write_bytes(source.read_bytes())
          print("Matching Firebase staging client config restored")
          PY
      - name: Enable Android microphone permissions in generated Capacitor project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.RECORD_AUDIO" />'
          if permission not in source:
              source = source.replace('<application', permission + '\n    <application', 1)
          manifest.write_text(source)
          main = Path("android/app/src/main/java/com/numyar/totichat/staging/MainActivity.java")
          main.parent.mkdir(parents=True, exist_ok=True)
          main.write_text("""package com.numyar.totichat.staging;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.webkit.PermissionRequest;
          import android.os.Bundle;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebChromeClient;

          public class MainActivity extends BridgeActivity {
              private PermissionRequest pendingMicrophoneRequest;
              private static final int MICROPHONE_PERMISSION_CODE = 2401;

              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  getBridge().getWebView().setWebChromeClient(new BridgeWebChromeClient(getBridge()) {
                      @Override public void onPermissionRequest(PermissionRequest request) {
                          boolean audioRequested = false;
                          for (String resource : request.getResources()) {
                              if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(resource)) audioRequested = true;
                          }
                          if (!audioRequested) {
                              request.deny();
                              return;
                          }
                          runOnUiThread(() -> {
                              if (ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) {
                                  request.grant(new String[]{PermissionRequest.RESOURCE_AUDIO_CAPTURE});
                              } else {
                                  pendingMicrophoneRequest = request;
                                  ActivityCompat.requestPermissions(MainActivity.this, new String[]{Manifest.permission.RECORD_AUDIO}, MICROPHONE_PERMISSION_CODE);
                              }
                          });
                      }
                  });
              }

              @Override public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == MICROPHONE_PERMISSION_CODE && pendingMicrophoneRequest != null) {
                      PermissionRequest request = pendingMicrophoneRequest;
                      pendingMicrophoneRequest = null;
                      if (grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                          request.grant(new String[]{PermissionRequest.RESOURCE_AUDIO_CAPTURE});
                      } else {
                          request.deny();
                      }
                  }
              }
          }
          """)
          PY
      - name: Sync Capacitor assets
        run: npx cap sync android
      - name: Configure Firebase Messaging in generated Capacitor Android project
        run: python3 scripts/configure-staging-fcm.py
      - name: Install approved TotiChat icon in regenerated Android project
        run: |
          set -euo pipefail
          SRC="assets/totichat_launcher.webp"
          RES="android/app/src/main/res"
          test -s "$SRC"
          # The CI workflow regenerates Android; inject the approved artwork after Capacitor sync.
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$density"
            rm -f "$RES/mipmap-$density/ic_launcher.png" "$RES/mipmap-$density/ic_launcher_round.png"
            cp "$SRC" "$RES/mipmap-$density/ic_launcher.webp"
            cp "$SRC" "$RES/mipmap-$density/ic_launcher_round.webp"
          done
          # Modern Android adaptive icons use the same photo, inset to avoid launcher masking.
          mkdir -p "$RES/drawable-nodpi" "$RES/drawable" "$RES/mipmap-anydpi-v26"
          cp "$SRC" "$RES/drawable-nodpi/totichat_launcher.webp"
          cat > "$RES/drawable/totichat_launcher_foreground.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <inset xmlns:android="http://schemas.android.com/apk/res/android" android:inset="18dp">
              <bitmap android:src="@drawable/totichat_launcher" android:gravity="fill" />
          </inset>
          XML
          for name in ic_launcher ic_launcher_round; do
            cat > "$RES/mipmap-anydpi-v26/$name.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/black" />
              <foreground android:drawable="@drawable/totichat_launcher_foreground" />
          </adaptive-icon>
          XML
          done
          test -s "$RES/mipmap-xxxhdpi/ic_launcher.webp"
      - name: Register Google OAuth callback
        run: node scripts/configure-android-oauth.mjs
      # Reuse the signing identity from the previously successful staging builds.
      # Without this cache, disposable runners create a different debug certificate
      # and Android rejects updates over an existing installation.
      - name: Restore stable staging debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: totichat-staging-debug-keystore-v2
      - name: Prepare staging signing key
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ -s "$HOME/.android/debug.keystore" ]; then
            echo "Using previously cached staging signing identity"
          else
            echo "::warning::Original staging signing key is unavailable. Generating a new persistent testing key; this APK cannot update an installation signed by the previous key."
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android | grep 'SHA256:' | head -n 1
      - name: Build Android debug APK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        working-directory: android
        run: |
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Verify microphone permission is packaged
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          "$AAPT" dump permissions android/app/build/outputs/apk/debug/app-debug.apk | tee /tmp/staging-permissions.txt
          grep -q 'android.permission.RECORD_AUDIO' /tmp/staging-permissions.txt
      - name: Verify generated APK integrity and signature
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" | tail -n 2
          unzip -Z1 "$APK" | grep -qx "AndroidManifest.xml"
          jarsigner -verify "$APK"
          # Android Package Manager validates APK signing schemes, not just JAR signatures.
          # Fail the build rather than publish an APK rejected on Android 14.
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs --min-sdk-version 34 "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep -E '^(package:|sdkVersion:|targetSdkVersion:|native-code:)' || true
          sha256sum "$APK" | tee android/app/build/outputs/apk/debug/app-debug.apk.sha256
          ls -lh "$APK"
      - name: Check APK alignment and Android package metadata
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -n 1)"
          "$ZIPALIGN" -c -v 4 "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | tee /tmp/staging-apk-badging.txt
          grep -q "^package: name='com.numyar.totichat.staging'" /tmp/staging-apk-badging.txt
      - name: Verify APK actually installs on Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -e
            adb wait-for-device
            adb shell getprop sys.boot_completed
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm path com.numyar.totichat.staging
            adb shell monkey -p com.numyar.totichat.staging 1
      # Do not publish the GitHub Actions ZIP artifact: Android users must
      # download the original APK directly from the release below.
      - name: Publish directly downloadable staging APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "TotiChat-Staging-${GITHUB_SHA:0:8}.apk"
          TAG="staging-apk-${GITHUB_SHA:0:8}"
          gh release create "$TAG" "TotiChat-Staging-${GITHUB_SHA:0:8}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "TotiChat Staging APK ${GITHUB_SHA:0:8}" \
            --notes "Android staging debug APK for testing. Direct APK download; no ZIP extraction needed." \
            --prerelease

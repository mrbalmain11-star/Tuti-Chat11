name: Staging TypeScript Check (No APK)
on:
  push:
    branches:
      - integration/legacy-backend-staging
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: totichat-staging-typescript
  cancel-in-progress: true
jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check TypeScript without building APK
        run: npm run lint

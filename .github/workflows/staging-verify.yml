name: TotiChat Clean Staging APK Build
on:
  push:
    branches:
      - integration/legacy-backend-staging
  workflow_dispatch:
concurrency:
  group: totichat-staging-clean-apk
  cancel-in-progress: true
permissions:
  contents: write
  issues: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Java 21 for Capacitor Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Java 21 compiler
        run: |
          java -version
          javac -version
          test "$(javac -version 2>&1 | awk '{print $2}' | cut -d. -f1)" = "21"
      - name: Clean install dependencies
        id: stage1
        run: npm install --no-audit --no-fund
      - name: Validate TypeScript
        id: stage2
        run: npm run lint
      - name: Require staging publishable key
        id: stage3
        env:
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Configure STAGING_SUPABASE_PUBLISHABLE_KEY before building a functional APK"
            exit 1
          fi
      - name: Verify staging API key before packaging
        id: stage4
        env:
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output /tmp/auth-health.json --write-out '%{http_code}' --header "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" "https://rziaedugbdwefbefcxjt.supabase.co/auth/v1/health")
          if [ "$status" != "200" ]; then
            echo "::error::Staging Supabase API key was rejected by Auth (HTTP $status)"
            exit 1
          fi
          echo "Staging Auth API key check passed"
      - name: Build staging web bundle
        id: stage5
        env:
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - name: Generate complete Android project in CI
        id: stage6
        run: |
          # Existing checked-in Android folder is incomplete (Gradle wrapper missing).
          # Regenerate it only inside the disposable CI runner; repository stays unchanged.
          rm -rf android
          npx cap add android
      - name: Enable Android microphone permissions in generated Capacitor project
        id: stage7
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          permissions = [
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
          ]
          for permission in permissions:
              if permission not in source:
                  source = source.replace('<application', permission + '\n    <application', 1)
          manifest.write_text(source)
          main = Path("android/app/src/main/java/com/numyar/totichat/staging/MainActivity.java")
          main.parent.mkdir(parents=True, exist_ok=True)
          main.write_text("""package com.numyar.totichat.staging;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.webkit.PermissionRequest;
          import android.os.Bundle;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebChromeClient;

          public class MainActivity extends BridgeActivity {
              private PermissionRequest pendingMicrophoneRequest;
              private static final int MICROPHONE_PERMISSION_CODE = 2401;

              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  getBridge().getWebView().getSettings().setMediaPlaybackRequiresUserGesture(false);
                  getBridge().getWebView().setWebChromeClient(new BridgeWebChromeClient(getBridge()) {
                      @Override public void onPermissionRequest(PermissionRequest request) {
                          boolean audioRequested = false;
                          for (String resource : request.getResources()) {
                              if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(resource)) audioRequested = true;
                          }
                          if (!audioRequested) {
                              request.deny();
                              return;
                          }
                          runOnUiThread(() -> {
                              if (ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) {
                                  request.grant(new String[]{PermissionRequest.RESOURCE_AUDIO_CAPTURE});
                              } else {
                                  pendingMicrophoneRequest = request;
                                  ActivityCompat.requestPermissions(MainActivity.this, new String[]{Manifest.permission.RECORD_AUDIO}, MICROPHONE_PERMISSION_CODE);
                              }
                          });
                      }
                  });
              }

              @Override public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == MICROPHONE_PERMISSION_CODE && pendingMicrophoneRequest != null) {
                      PermissionRequest request = pendingMicrophoneRequest;
                      pendingMicrophoneRequest = null;
                      if (grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                          request.grant(new String[]{PermissionRequest.RESOURCE_AUDIO_CAPTURE});
                      } else {
                          request.deny();
                      }
                  }
              }
          }
          """)
          PY
      - name: Sync Capacitor assets
        id: stage8
        run: npx cap sync android
      - name: Register Google OAuth callback
        id: stage9
        run: node scripts/configure-android-oauth.mjs
      - name: Build Android debug APK
        id: stage10
        working-directory: android
        run: |
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Verify microphone permission is packaged
        id: stage11
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          "$AAPT" dump permissions android/app/build/outputs/apk/debug/app-debug.apk | tee /tmp/staging-permissions.txt
          grep -q 'android.permission.RECORD_AUDIO' /tmp/staging-permissions.txt
      - name: Verify generated APK integrity and signature
        id: stage12
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" | tail -n 2
          unzip -Z1 "$APK" | grep -qx "AndroidManifest.xml"
          jarsigner -verify "$APK"
          sha256sum "$APK" | tee android/app/build/outputs/apk/debug/app-debug.apk.sha256
          ls -lh "$APK"
      - name: Verify APK is extractable from Android ZIP
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib, tempfile
          source=Path('android/app/build/outputs/apk/debug/app-debug.apk')
          with tempfile.TemporaryDirectory() as folder:
              target=Path(folder)/'TotiChat-verify.zip'
              with ZipFile(target,'w') as archive:
                  archive.write(source,arcname='TotiChat.apk')
              with ZipFile(target) as archive:
                  extracted=Path(folder)/archive.namelist()[0]
                  archive.extractall(folder)
              assert extracted.is_file()
              assert extracted.read_bytes()[:4]==b'PK\x03\x04'
              assert hashlib.sha256(extracted.read_bytes()).digest()==hashlib.sha256(source.read_bytes()).digest()
          print('Android APK archive extraction verified')
          PY
      - name: Package and verify single-APK ZIP for Android phones
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_STORED, is_zipfile
          import hashlib
          apk=Path('android/app/build/outputs/apk/debug/app-debug.apk')
          assert apk.is_file() and apk.stat().st_size>1000000, 'Missing or unexpectedly small APK'
          name='TotiChat-Staging-'+__import__('os').environ['GITHUB_SHA'][:8]
          target=Path(name+'.zip')
          # Keep the archive as simple as possible for Android file managers:
          # one short ASCII entry, no Zip64, no compression, no extra metadata.
          with ZipFile(target,'w',compression=ZIP_STORED,allowZip64=False) as archive:
              archive.write(apk,arcname='TotiChat.apk',compress_type=ZIP_STORED)
          assert is_zipfile(target)
          with ZipFile(target) as archive:
              assert archive.namelist()==['TotiChat.apk']
              assert archive.testzip() is None
              assert hashlib.sha256(archive.read('TotiChat.apk')).digest()==hashlib.sha256(apk.read_bytes()).digest()
          print('Verified Android-compatible ZIP:',target,'size:',target.stat().st_size)
          PY
      # Do not publish a GitHub Actions artifact: the Actions download is
      # automatically wrapped in another ZIP, which Android file managers
      # can mistake for the installable archive. Publish only the verified
      # single-APK release ZIP below.
      # Keep the download inside the same GitHub Actions run, as requested.
      # GitHub automatically wraps Actions artifacts in ZIP; this artifact
      # contains only the verified APK, with no extra nested ZIP.
      - name: Upload installable APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TotiChat-APK-Install
          path: android/app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
          if-no-files-found: error

      - name: Publish directly downloadable staging APK
        id: stage13
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          NAME="TotiChat-Staging-${GITHUB_SHA:0:8}"
          cp "$APK" "$NAME.apk"
          test -s "$NAME.zip"
          unzip -t "$NAME.zip" | tee /tmp/totichat-zip-check.txt
          python3 - "$NAME.zip" "$NAME.apk" <<'PY'
          import hashlib,sys
          from pathlib import Path
          from zipfile import ZipFile
          archive_path,apk_path=map(Path,sys.argv[1:])
          with ZipFile(archive_path) as archive:
              names=archive.namelist()
              assert names==['TotiChat.apk'], f'Unexpected ZIP members: {names}'
              assert archive.testzip() is None, 'Corrupt ZIP entry'
              assert hashlib.sha256(archive.read(names[0])).digest()==hashlib.sha256(apk_path.read_bytes()).digest(), 'ZIP APK does not match release APK'
          print('Release ZIP and APK payloads match')
          PY
          test "$(unzip -Z1 "$NAME.zip" | wc -l)" -eq 1
          test "$(unzip -Z1 "$NAME.zip")" = "TotiChat.apk"
          TAG="staging-apk-${GITHUB_SHA:0:8}"
          gh release create "$TAG" "$NAME.apk" "$NAME.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "TotiChat Staging APK ${GITHUB_SHA:0:8}" \
            --notes "ZIP contains one installable APK; ZIP archive integrity verified before release." \
            --prerelease
          {
            echo "## Android phone download"
            echo ""
            echo "Use the **release ZIP**, not a GitHub Actions artifact:"
            echo ""
            echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$NAME.zip"
            echo ""
            echo "Inside the ZIP: TotiChat.apk (one file, no nested archive)."
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Report precise failing stage in Actions summary
        if: failure()
        env:
          STAGE_RESULTS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json,os
          data=json.loads(os.environ['STAGE_RESULTS'])
          failed=[(key,entry.get('conclusion')) for key,entry in data.items() if entry.get('conclusion')=='failure']
          lines=['## TotiChat APK build failure', '', 'Failed steps:']
          lines += ['- '+key+' : '+str(status) for key,status in failed] or ['- Unknown; inspect runner logs']
          lines += ['', 'The Android APK was not published. Do not download an older artifact as the new build.']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY

      - name: Publish failure diagnosis as GitHub issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE_RESULTS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json,os
          data=json.loads(os.environ['STAGE_RESULTS'])
          failed=[key for key,entry in data.items() if entry.get('conclusion')=='failure']
          with open('/tmp/totichat-build-diagnosis.md','w') as f:
              f.write('## TotiChat staging APK build diagnosis\n\n')
              f.write('Commit: '+os.environ['GITHUB_SHA']+'\n\n')
              f.write('Run: '+os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']+'\n\n')
              f.write('Failed step IDs: '+(', '.join(failed) if failed else 'Unknown')+'\n\n')
              f.write('All step results:\n\n')
              for key,entry in data.items():
                  f.write('- '+key+': '+str(entry.get('conclusion','unknown'))+'\n')
          PY
          gh issue create --repo "$GITHUB_REPOSITORY" --title "TotiChat APK build failure diagnosis - ${GITHUB_SHA:0:8}" --body-file /tmp/totichat-build-diagnosis.md || true

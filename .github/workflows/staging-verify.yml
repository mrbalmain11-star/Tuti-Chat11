name: TotiChat Clean Staging APK Build
# APK builds require an explicit manual workflow dispatch.
on:
  workflow_dispatch:
concurrency:
  group: totichat-staging-clean-apk
  cancel-in-progress: true
permissions:
  contents: write
  issues: write
  actions: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Java 21 for Capacitor Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Java 21 compiler
        run: |
          java -version
          javac -version
          test "$(javac -version 2>&1 | awk '{print $2}' | cut -d. -f1)" = "21"
      - name: Clean install dependencies
        id: stage1
        run: npm install --no-audit --no-fund
      - name: Validate TypeScript
        id: stage2
        run: npm run lint
      - name: Require staging publishable key
        id: stage3
        env:
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Configure STAGING_SUPABASE_PUBLISHABLE_KEY before building a functional APK"
            exit 1
          fi
      - name: Verify staging API key before packaging
        id: stage4
        env:
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output /tmp/auth-health.json --write-out '%{http_code}' --header "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" "https://rziaedugbdwefbefcxjt.supabase.co/auth/v1/health")
          if [ "$status" != "200" ]; then
            echo "::error::Staging Supabase API key was rejected by Auth (HTTP $status)"
            exit 1
          fi
          echo "Staging Auth API key check passed"
      - name: Build staging web bundle
        id: stage5
        env:
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - name: Generate complete Android project in CI
        id: stage6
        run: |
          # Existing checked-in Android folder is incomplete (Gradle wrapper missing).
          # Regenerate it only inside the disposable CI runner; repository stays unchanged.
          rm -rf android
          npx cap add android
      - name: Enable Android microphone permissions in generated Capacitor project
        id: stage7
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          permissions = [
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
          ]
          for permission in permissions:
              if permission not in source:
                  source = source.replace('<application', permission + '\n    <application', 1)
          manifest.write_text(source)
          main = Path("android/app/src/main/java/com/numyar/totichat/staging/MainActivity.java")
          main.parent.mkdir(parents=True, exist_ok=True)
          main.write_text("""package com.numyar.totichat.staging;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.webkit.PermissionRequest;
          import android.os.Bundle;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebChromeClient;

          public class MainActivity extends BridgeActivity {
              private PermissionRequest pendingMicrophoneRequest;
              private static final int MICROPHONE_PERMISSION_CODE = 2401;

              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  getBridge().getWebView().getSettings().setMediaPlaybackRequiresUserGesture(false);
                  getBridge().getWebView().setWebChromeClient(new BridgeWebChromeClient(getBridge()) {
                      @Override public void onPermissionRequest(PermissionRequest request) {
                          boolean audioRequested = false;
                          for (String resource : request.getResources()) {
                              if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(resource)) audioRequested = true;
                          }
                          if (!audioRequested) {
                              request.deny();
                              return;
                          }
                          runOnUiThread(() -> {
                              if (ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) {
                                  request.grant(new String[]{PermissionRequest.RESOURCE_AUDIO_CAPTURE});
                              } else {
                                  pendingMicrophoneRequest = request;
                                  ActivityCompat.requestPermissions(MainActivity.this, new String[]{Manifest.permission.RECORD_AUDIO}, MICROPHONE_PERMISSION_CODE);
                              }
                          });
                      }
                  });
              }

              @Override public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == MICROPHONE_PERMISSION_CODE && pendingMicrophoneRequest != null) {
                      PermissionRequest request = pendingMicrophoneRequest;
                      pendingMicrophoneRequest = null;
                      if (grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                          request.grant(new String[]{PermissionRequest.RESOURCE_AUDIO_CAPTURE});
                      } else {
                          request.deny();
                      }
                  }
              }
          }
          """)
          PY
      - name: Sync Capacitor assets
        id: stage8
        run: npx cap sync android
      - name: Install approved TotiChat icon in regenerated Android project
        run: |
          set -euo pipefail
          SRC="assets/totichat_launcher.webp"
          RES="android/app/src/main/res"
          test -s "$SRC"
          # Inject artwork into disposable Android folder AFTER Capacitor regeneration.
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$density"
            rm -f "$RES/mipmap-$density/ic_launcher.png" "$RES/mipmap-$density/ic_launcher_round.png"
            cp "$SRC" "$RES/mipmap-$density/ic_launcher.webp"
            cp "$SRC" "$RES/mipmap-$density/ic_launcher_round.webp"
          done
          mkdir -p "$RES/drawable-nodpi" "$RES/drawable" "$RES/mipmap-anydpi-v26"
          cp "$SRC" "$RES/drawable-nodpi/totichat_launcher.webp"
          cat > "$RES/drawable/totichat_launcher_foreground.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <inset xmlns:android="http://schemas.android.com/apk/res/android" android:inset="18dp">
              <bitmap android:src="@drawable/totichat_launcher" android:gravity="fill" />
          </inset>
          XML
          for name in ic_launcher ic_launcher_round; do
            cat > "$RES/mipmap-anydpi-v26/$name.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/black" />
              <foreground android:drawable="@drawable/totichat_launcher_foreground" />
          </adaptive-icon>
          XML
          done
          test -s "$RES/mipmap-xxxhdpi/ic_launcher.webp"
      - name: Register Google OAuth callback
        id: stage9
        run: node scripts/configure-android-oauth.mjs
      # CI runners are disposable. Without a persisted debug keystore, each build
      # gets a new signing certificate and Android rejects in-place upgrades.
      - name: Restore stable staging debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: totichat-staging-debug-keystore-v1
      - name: Build Android debug APK
        id: stage10
        working-directory: android
        run: |
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Verify microphone permission is packaged
        id: stage11
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          "$AAPT" dump permissions android/app/build/outputs/apk/debug/app-debug.apk | tee /tmp/staging-permissions.txt
          grep -q 'android.permission.RECORD_AUDIO' /tmp/staging-permissions.txt
      - name: Verify generated APK integrity and signature
        id: stage12
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" | tail -n 2
          unzip -p "$APK" AndroidManifest.xml >/dev/null
          test "$(stat -c %s "$APK")" -gt 1000000
          unzip -Z1 "$APK" | grep -qx "AndroidManifest.xml"
          jarsigner -verify "$APK"
          # Record the actual signing identity to diagnose Android install failures.
          keytool -printcert -jarfile "$APK" | tee /tmp/totichat-apk-signing.txt
          sha256sum "$APK" | tee android/app/build/outputs/apk/debug/app-debug.apk.sha256
          ls -lh "$APK"
      - name: Verify APK is extractable from Android ZIP
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib, tempfile
          source=Path('android/app/build/outputs/apk/debug/app-debug.apk')
          with tempfile.TemporaryDirectory() as folder:
              target=Path(folder)/'TotiChat-verify.zip'
              with ZipFile(target,'w') as archive:
                  archive.write(source,arcname='TotiChat.apk')
              with ZipFile(target) as archive:
                  extracted=Path(folder)/archive.namelist()[0]
                  archive.extractall(folder)
              assert extracted.is_file()
              assert extracted.read_bytes()[:4]==b'PK\x03\x04'
              assert hashlib.sha256(extracted.read_bytes()).digest()==hashlib.sha256(source.read_bytes()).digest()
          print('Android APK archive extraction verified')
          PY
      - name: Package APK with legacy-compatible ZIP tooling
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          NAME="TotiChat-Staging-${GITHUB_SHA:0:8}"
          test -s "$APK"
          mkdir -p /tmp/totichat-legacy-package
          cp "$APK" /tmp/totichat-legacy-package/TotiChat.apk
          # Use the traditional system ZIP writer instead of Python's archive writer.
          # -0 stores the already-compressed APK; -X strips extended metadata.
          (cd /tmp/totichat-legacy-package && zip -0 -X "$GITHUB_WORKSPACE/$NAME.zip" TotiChat.apk)
          test "$(unzip -Z1 "$NAME.zip")" = "TotiChat.apk"
          unzip -t "$NAME.zip"
          mkdir -p /tmp/totichat-legacy-extract
          unzip -o "$NAME.zip" -d /tmp/totichat-legacy-extract
          cmp "$APK" /tmp/totichat-legacy-extract/TotiChat.apk
          # Independent Java ZIP reader validation, matching Android's ZIP family.
          jar tf "$NAME.zip" | grep -qx TotiChat.apk
          python3 - <<'PY'
          from zipfile import ZipFile, ZIP_STORED
          import os
          name='TotiChat-Staging-'+os.environ['GITHUB_SHA'][:8]+'.zip'
          with ZipFile(name) as archive:
              assert len(archive.infolist())==1
              item=archive.infolist()[0]
              assert item.filename=='TotiChat.apk'
              assert item.compress_type==ZIP_STORED
              assert not item.flag_bits & 0x08
              assert archive.testzip() is None
          print('Legacy ZIP validated by unzip, jar, and Python; APK bytes identical')
          PY
      # Do not publish a GitHub Actions artifact: the Actions download is
      # automatically wrapped in another ZIP, which Android file managers
      # can mistake for the installable archive. Publish only the verified
      # single-APK release ZIP below.
      # Keep the download inside the same GitHub Actions run, as requested.
      # GitHub automatically wraps Actions artifacts in ZIP; this artifact
      # contains only the verified APK, with no extra nested ZIP.
      - name: Prepare clean phone installer for Actions download
        run: |
          set -euo pipefail
          mkdir -p phone-installer
          cp android/app/build/outputs/apk/debug/app-debug.apk phone-installer/TotiChat.apk
          cmp android/app/build/outputs/apk/debug/app-debug.apk phone-installer/TotiChat.apk
          test -s phone-installer/TotiChat.apk
      - name: Upload installable APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TotiChat-APK-Install
          path: phone-installer/TotiChat.apk
          compression-level: 0
          if-no-files-found: error

      - name: Download and extract actual published Actions artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Verify the exact ZIP GitHub serves to users, not only a locally made ZIP.
          artifact_id=""
          for attempt in $(seq 1 15); do
            artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name=="TotiChat-APK-Install" and .expired==false) | .id' | head -n 1)
            if [ -n "$artifact_id" ]; then break; fi
            sleep 3
          done
          test -n "$artifact_id"
          gh api -H "Accept: application/vnd.github+json" "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > /tmp/totichat-actions-download.zip
          test -s /tmp/totichat-actions-download.zip
          unzip -t /tmp/totichat-actions-download.zip
          test "$(unzip -Z1 /tmp/totichat-actions-download.zip | wc -l)" -eq 1
          mkdir -p /tmp/totichat-artifact-extracted
          unzip -o /tmp/totichat-actions-download.zip -d /tmp/totichat-artifact-extracted
          test -s /tmp/totichat-artifact-extracted/TotiChat.apk
          cmp android/app/build/outputs/apk/debug/app-debug.apk /tmp/totichat-artifact-extracted/TotiChat.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          "$AAPT" dump badging /tmp/totichat-artifact-extracted/TotiChat.apk | head -n 2
          # Detect archive features unsupported by some Android built-in extractors.
          python3 - <<'PY'
          import struct,zipfile
          p='/tmp/totichat-actions-download.zip'
          with zipfile.ZipFile(p) as z:
              entries=z.infolist()
              assert len(entries)==1 and entries[0].filename=='TotiChat.apk'
              info=entries[0]
              assert info.file_size < 0xffffffff, 'Unexpected ZIP64 entry'
              assert info.header_offset < 0xffffffff, 'Unexpected ZIP64 offset'
              assert info.flag_bits & 1 == 0, 'Encrypted artifact'
              # GitHub Actions uses streaming ZIP entries with data descriptors.
              # This is valid ZIP and must not fail an otherwise successful extraction.
              print('ZIP data descriptor:', bool(info.flag_bits & 8))
              assert info.compress_type in (0,8), 'Unexpected compression method'
              print('Actions ZIP compatibility: method',info.compress_type,'flags',hex(info.flag_bits),'creator',info.create_system)
          PY
          echo "Published GitHub Actions ZIP extracts correctly and APK bytes match."

      - name: Publish directly downloadable staging APK
        id: stage13
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          NAME="TotiChat-Staging-${GITHUB_SHA:0:8}"
          cp "$APK" "$NAME.apk"
          test -s "$NAME.zip"
          unzip -t "$NAME.zip" | tee /tmp/totichat-zip-check.txt
          python3 - "$NAME.zip" "$NAME.apk" <<'PY'
          import hashlib,sys
          from pathlib import Path
          from zipfile import ZipFile
          archive_path,apk_path=map(Path,sys.argv[1:])
          with ZipFile(archive_path) as archive:
              names=archive.namelist()
              assert names==['TotiChat.apk'], f'Unexpected ZIP members: {names}'
              assert archive.testzip() is None, 'Corrupt ZIP entry'
              assert hashlib.sha256(archive.read(names[0])).digest()==hashlib.sha256(apk_path.read_bytes()).digest(), 'ZIP APK does not match release APK'
          print('Release ZIP and APK payloads match')
          PY
          test "$(unzip -Z1 "$NAME.zip" | wc -l)" -eq 1
          test "$(unzip -Z1 "$NAME.zip")" = "TotiChat.apk"
          TAG="staging-apk-${GITHUB_SHA:0:8}"
          # Reruns of the same commit must reuse the release instead of failing on an existing tag.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$NAME.apk" "$NAME.zip" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$NAME.apk" "$NAME.zip" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "TotiChat Staging APK ${GITHUB_SHA:0:8}" \
              --notes "ZIP contains one installable APK; ZIP archive integrity verified before release." \
              --prerelease
          fi
          # Validate the actual published release ZIP, not just the local build file.
          mkdir -p /tmp/totichat-published-download /tmp/totichat-published-extract
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$NAME.zip" --dir /tmp/totichat-published-download
          unzip -t "/tmp/totichat-published-download/$NAME.zip"
          test "$(unzip -Z1 "/tmp/totichat-published-download/$NAME.zip")" = "TotiChat.apk"
          unzip -o "/tmp/totichat-published-download/$NAME.zip" -d /tmp/totichat-published-extract
          cmp "$APK" /tmp/totichat-published-extract/TotiChat.apk
          {
            echo "## تحميل نسخة الهاتف من نفس صفحة البناء"
            echo ""
            echo "**استخدم رابط ZIP التالي بالتغليف التقليدي المفحوص بعد النشر، وليس ملف Actions Artifacts:**"
            echo ""
            echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$NAME.zip"
            echo ""
            echo "### APK بدون استخراج"
            echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$NAME.apk"
            echo ""
            echo "تم تنزيل ZIP المنشور مجدداً وفكّه ومطابقة APK مع ناتج البناء."
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Report precise failing stage in Actions summary
        if: failure()
        env:
          STAGE_RESULTS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json,os
          data=json.loads(os.environ['STAGE_RESULTS'])
          failed=[(key,entry.get('conclusion')) for key,entry in data.items() if entry.get('conclusion')=='failure']
          lines=['## TotiChat APK build failure', '', 'Failed steps:']
          lines += ['- '+key+' : '+str(status) for key,status in failed] or ['- Unknown; inspect runner logs']
          lines += ['', 'The Android APK was not published. Do not download an older artifact as the new build.']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY

      - name: Publish failure diagnosis as GitHub issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE_RESULTS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json,os
          data=json.loads(os.environ['STAGE_RESULTS'])
          failed=[key for key,entry in data.items() if entry.get('conclusion')=='failure']
          with open('/tmp/totichat-build-diagnosis.md','w') as f:
              f.write('## TotiChat staging APK build diagnosis\n\n')
              f.write('Commit: '+os.environ['GITHUB_SHA']+'\n\n')
              f.write('Run: '+os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']+'\n\n')
              f.write('Failed step IDs: '+(', '.join(failed) if failed else 'Unknown')+'\n\n')
              f.write('All step results:\n\n')
              for key,entry in data.items():
                  f.write('- '+key+': '+str(entry.get('conclusion','unknown'))+'\n')
          PY
          gh issue create --repo "$GITHUB_REPOSITORY" --title "TotiChat APK build failure diagnosis - ${GITHUB_SHA:0:8}" --body-file /tmp/totichat-build-diagnosis.md || true
